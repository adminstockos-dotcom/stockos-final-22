<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOCKOS SUPER ADMIN - ESTABLE V3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#F6F8FA}</style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">

<div class="bg-white rounded-[24px] p-6 border flex justify-between items-center mb-6">
  <div><h1 class="font-black text-xl">STOCKOS <span class="text-[#1ECB6A]">SUPER ADMIN</span></h1><small class="text-[10px] opacity-60">V3 FIX - Crear Empresa 100% funcional</small></div>
  <div class="text-right"><b class="text-[12px]">Panel Principal</b><br><small class="text-[10px] opacity-60">Crear → Aprobar → Ver Panel</small></div>
</div>

<!-- 1. CREAR EMPRESA -->
<div class="bg-white border border-black/10 rounded-[20px] p-6 mb-6">
  <h3 class="font-black text-[14px] mb-4">1. Crear empresa directa (Principal Admin)</h3>
  <div class="grid md:grid-cols-4 gap-3">
    <div><label class="text-[11px] font-bold">Nombre Empresa *</label><input id="nEmp" placeholder="Ej: MAXIMA" class="w-full h-11 border rounded-full px-5 text-[12px] bg-[#F6F8FA]"></div>
    <div><label class="text-[11px] font-bold">WhatsApp</label><input id="nWA" placeholder="57300..." class="w-full h-11 border rounded-full px-5 text-[12px] bg-[#F6F8FA]"></div>
    <div><label class="text-[11px] font-bold">Email</label><input id="nEmail" placeholder="correo@empresa.com" class="w-full h-11 border rounded-full px-5 text-[12px] bg-[#F6F8FA]"></div>
    <div><label class="text-[11px] font-bold">NIT</label><input id="nNit" placeholder="900123456" class="w-full h-11 border rounded-full px-5 text-[12px] bg-[#F6F8FA]"></div>
  </div>
  <button id="btnCrear" onclick="crearDirecta()" class="mt-4 h-11 px-8 bg-[#1ECB6A] hover:bg-[#17a556] text-white rounded-full text-[12px] font-black">Crear empresa</button>
  <small id="msgCrear" class="ml-3 text-[11px]"></small>
</div>

<!-- LISTA EMPRESAS -->
<div class="bg-white border border-black/10 rounded-[20px] p-6 mb-6">
  <h3 class="font-black text-[14px] mb-4">Empresas Creadas</h3>
  <div id="listaVentas" class="grid gap-3"></div>
</div>

<!-- PANEL EMPRESA INLINE -->
<div id="panelEmpresa" class="hidden bg-white border-2 border-[#1ECB6A] rounded-[20px] p-6">
  <div class="flex justify-between"><h3 class="font-black">Panel Activo: <span id="nombreEmpresaActiva" class="text-[#1ECB6A]"></span></h3><button onclick="cerrarPanel()" class="text-[11px] bg-black text-white px-4 py-1 rounded-full">Cerrar</button></div>
  <div id="modulosBox" class="mt-4 grid md:grid-cols-3 gap-3"></div>
  <div class="mt-6 border-t pt-4">
    <h4 class="font-bold text-[12px] mb-2">Personas Contacto</h4>
    <div class="flex gap-2 flex-wrap"><input id="perNombre" placeholder="Nombre" class="h-9 border rounded-full px-4 text-[11px]"><input id="perCargo" placeholder="Cargo" class="h-9 border rounded-full px-4 text-[11px]"><input id="perWA" placeholder="WA" class="h-9 border rounded-full px-4 text-[11px]"><button onclick="guardarPersona()" class="h-9 px-4 bg-[#0A2640] text-white rounded-full text-[11px]">Guardar</button></div>
    <div id="listaPersonas" class="mt-3"></div>
  </div>
</div>

<script>
let supa=null;
let empresaActiva="";
function safeGet(k,d){try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch{return d;}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.error(e)}}

async function initSupa(){
  try{
    const url = localStorage.getItem('sb_url') || 'https://hgxjwpwaschzlkxpyqzqv.supabase.co';
    const key = localStorage.getItem('sb_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhneGp3cHdhc2NoemxreHB5cXpRdiIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzM3MDYzMjAwLCJleHAiOjIwNTI2MzkyMDB9.8u7-4-4-4-placeholder';
    if(window.supabase) supa = window.supabase.createClient(url,key);
  }catch(e){console.log('Supabase offline',e)}
}

function render(){
  const lista = safeGet('stockos_ventas',[]);
  const cont = document.getElementById('listaVentas');
  if(lista.length===0){ cont.innerHTML='<small class="opacity-60 text-[11px]">Sin empresas - crea arriba</small>'; return;}
  cont.innerHTML = lista.map(x=>`
    <div class="border rounded-[16px] p-4 flex flex-col md:flex-row md:justify-between gap-3 bg-[#F6F8FA]">
      <div><b class="text-[13px]">${x.empresa}</b><br><small class="text-[10px] opacity-60">${x.wa||''} ${x.email||''} • ${x.fecha||''} • ${x.estado}</small></div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="verPanel('${x.empresa.replace(/'/g,'')}')" class="h-8 px-4 bg-[#1ECB6A] text-white rounded-full text-[10px] font-bold">Ver Panel</button>
        <button onclick="aprobarSupa(${x.id})" class="h-8 px-4 bg-[#0A2640] text-white rounded-full text-[10px]">Aprobar</button>
        <button onclick="eliminar(${x.id})" class="h-8 px-3 bg-red-500 text-white rounded-full text-[10px]">X</button>
      </div>
    </div>
  `).join('');
}

function crearDirecta(){
  try{
    const empEl=document.getElementById('nEmp');
    const waEl=document.getElementById('nWA');
    const emailEl=document.getElementById('nEmail');
    const nitEl=document.getElementById('nNit');
    const msg=document.getElementById('msgCrear');
    const emp=empEl.value.trim();
    if(!emp){ alert('Nombre empresa requerido'); empEl.focus(); return; }
    let l=safeGet('stockos_ventas',[]);
    // evitar duplicado
    if(l.some(e=>e.empresa.toLowerCase()===emp.toLowerCase())){ alert('Empresa ya existe'); return; }
    const nuevo={id:Date.now(),empresa:emp,wa:waEl.value.trim(),email:emailEl.value.trim(),nit:nitEl.value.trim(),total:100000,estado:'pausado',origen:'superadmin_directo',fecha:new Date().toLocaleString()};
    l.push(nuevo);
    safeSet('stockos_ventas',l);
    empEl.value=''; waEl.value=''; emailEl.value=''; nitEl.value='';
    render();
    msg.innerText='✅ '+emp+' creada';
    setTimeout(()=>msg.innerText='',3000);
    // efecto visual
    const toast=document.createElement('div'); toast.className='fixed top-4 left-1/2 -translate-x-1/2 bg-[#1ECB6A] text-white px-6 py-3 rounded-full text-[12px] font-bold z-50 shadow-lg'; toast.innerText='✅ Empresa creada: '+emp; document.body.appendChild(toast); setTimeout(()=>toast.remove(),3000);
    console.log('Empresa creada',nuevo);
  }catch(e){
    alert('Error crear: '+e.message); console.error(e);
  }
}

function eliminar(id){ if(!confirm('¿Eliminar empresa?')) return; let l=safeGet('stockos_ventas',[]); l=l.filter(x=>x.id!==id); safeSet('stockos_ventas',l); render(); }
async function aprobarSupa(id){
  let l=safeGet('stockos_ventas',[]); let c=l.find(x=>x.id==id); if(!c) return;
  try{ if(!supa) await initSupa(); if(supa){ const {error}=await supa.from('empresas').insert({name:c.empresa,whatsapp:c.wa||'',email:c.email||'',nit:c.nit||'',estado:'aprobado'}); if(error) throw error; } }catch(e){console.log('Supa err',e)}
  l=l.map(x=> x.id==id?{...x,estado:'aprobado'}:x); safeSet('stockos_ventas',l); render(); alert('Aprobada: '+c.empresa);
}
function verPanel(empresa){
  localStorage.setItem('stockos_empresa_activa',empresa);
  empresaActiva=empresa;
  // CORRECCION NOMBRE ARCHIVO - usa el que SI subiste
  const url='PANEL-EMPRESA-FINAL-BLINDADO-6MODULOS.html?empresa='+encodeURIComponent(empresa);
  window.open(url,'_blank');
  try{
    document.getElementById('nombreEmpresaActiva').innerText=empresa;
    document.getElementById('panelEmpresa').classList.remove('hidden');
    renderModulos(); renderPersonas();
    document.getElementById('panelEmpresa').scrollIntoView({behavior:'smooth'});
  }catch(e){}
}
function cerrarPanel(){ document.getElementById('panelEmpresa').classList.add('hidden'); empresaActiva=""; }
function renderModulos(){
  const mods=['Inventario','Ventas','Compras','Clientes','Proveedores','Reportes'];
  document.getElementById('modulosBox').innerHTML=mods.map(m=>`<div class="border rounded-xl p-3 bg-white text-[11px]"><b>${m}</b><br><small class="opacity-60">${empresaActiva}</small></div>`).join('');
}
function guardarPersona(){
  const n=document.getElementById('perNombre').value.trim(); if(!n){alert('Nombre');return;}
  if(!empresaActiva){alert('Abre un panel primero');return;}
  let l=safeGet('personas_'+empresaActiva,[]); l.push({id:Date.now(),nombre:n,cargo:document.getElementById('perCargo').value,wa:document.getElementById('perWA').value});
  safeSet('personas_'+empresaActiva,l); document.getElementById('perNombre').value=''; document.getElementById('perCargo').value=''; document.getElementById('perWA').value=''; renderPersonas();
}
function renderPersonas(){
  if(!empresaActiva) return;
  const l=safeGet('personas_'+empresaActiva,[]);
  document.getElementById('listaPersonas').innerHTML=l.map(p=>`<div class="border rounded-xl p-2 text-[11px] flex justify-between bg-white"><span><b>${p.nombre}</b> - ${p.cargo} - ${p.wa}</span></div>`).join('')||'<small class="opacity-60 text-[10px]">Sin personas</small>';
}
initSupa(); render();
</script>
</body>
</html>
