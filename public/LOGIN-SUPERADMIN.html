<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>STOCKOS SuperAdmin V27</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Montserrat,sans-serif}</style>
</head><body class="bg-[#0A2342] flex items-center justify-center min-h-screen">
<div class="w-full max-w-[400px] bg-white rounded-[24px] p-8 shadow-2xl">
<div class="flex flex-col items-center">
<div class="w-14 h-14 bg-[#0A2342] rounded-full flex items-center justify-center"><span class="text-white font-black text-[22px]">S</span></div>
<h1 class="mt-4 font-black text-[16px] text-[#0A2342]">STOCKOS SuperAdmin</h1>
<small class="text-[11px] opacity-60 mt-1">Acceso solo super admin &nbsp; V27</small>
<small class="text-[9px] opacity-40 mt-1">Solo ingresar desde landing con email y contraseña</small>
</div>
<div class="mt-6 grid gap-3">
<input id="user" placeholder="adminstockos@gmail.com" value="adminstockos@gmail.com" class="h-11 border border-black/10 rounded-full px-5 text-[12px] bg-white outline-none">
<input id="pass" type="password" placeholder="••••••••••" class="h-11 border border-black/10 rounded-full px-5 text-[12px] bg-white outline-none">
<button onclick="login()" class="h-11 bg-[#0A2342] text-white rounded-full text-[12px] font-black">Ingresar</button>
<div class="flex justify-between items-center mt-2">
<a href="/" class="text-[10px] opacity-60 hover:opacity-100">← Volver a Landing</a><span class="text-[9px] opacity-30">V27</span>
</div>
</div>
</div>
<script>
function safeGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function login(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(!u||!p){alert('Usuario y contraseña');return;}
  safeSet('stockos_superadmin',{user:u,login:Date.now()});
  window.location.href='/01-ADMIN-FINAL-ESTABLE-CORRIGIDO.html';
}
</script>
</body></html>
