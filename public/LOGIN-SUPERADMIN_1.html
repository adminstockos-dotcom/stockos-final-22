<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>STOCKOS - Login SuperAdmin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Montserrat,sans-serif} .logo-stock{font-weight:900} .logo-os{font-weight:300} .dot-green{width:10px;height:10px;background:#1ECB6A;border-radius:50%;display:inline-block;margin-left:2px;vertical-align:super}</style>
</head><body class="bg-[#FBFCFE] flex items-center justify-center min-h-screen">
<div class="w-full max-w-[420px] bg-white border border-black/10 rounded-[24px] p-8">
<div class="text-center"><span class="text-[28px]"><span class="logo-stock">STOCK</span><span class="logo-os">OS</span><span class="dot-green"></span></span><br><small class="text-[11px] opacity-60">SuperAdmin V32 - Solo SuperAdmin</small></div>
<div class="mt-6 grid gap-3">
<input id="user" placeholder="Usuario SuperAdmin" class="h-11 border rounded-full px-5 text-[12px] bg-[#F6F8FA] outline-none">
<input id="pass" type="password" placeholder="Contraseña" class="h-11 border rounded-full px-5 text-[12px] bg-[#F6F8FA] outline-none">
<button onclick="login()" class="h-11 bg-[#0A2640] text-white rounded-full text-[12px] font-black">Entrar a SuperAdmin</button>
</div>
<p class="mt-4 text-[10px] opacity-60 text-center">Acceso directo a /admin para crear empresas - Tarifa $100.000 x módulo</p>
</div>
<script>
function safeGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function login(){
const u=document.getElementById('user').value.trim();
const p=document.getElementById('pass').value.trim();
if(!u||!p){alert('Usuario y contraseña');return;}
safeSet('stockos_superadmin',{user:u,login:Date.now()});
window.location.href='/01-ADMIN-FINAL-ESTABLE-CORRIGIDO.html';
}
</script>
</body></html>
